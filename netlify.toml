[build]
  command = "npm install && npm run build --workspace=packages/shared && npm run build --workspace=packages/client"
  publish = "packages/client/dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: all routes serve index.html, client-side HashRouter handles the rest.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
